[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-workspace"
dynamic = ["version"]
authors = [
    {name = "Marcus Jellinghaus"},
]
description = "A simple Model Context Protocol (MCP) server with file operation tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "server", "filesystem", "claude", "ai", "assistant", "file-operations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pathspec>=1.1.1",
    "igittigitt>=2.1.5",
    "mcp>=1.3.0,<2.0.0",
    "GitPython>=3.1.0",
    "mcp-coder-utils",
    "PyGithub>=2.10.0",
    "markdown-it-py>=3.0.0",
    "truststore",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-xdist>=3.6.1",
    "pytest-cov",
    "diff-cover",
    "pylint>=3.3.3",
    "mypy>=1.13.0",
    "ruff~=0.17.2",
    "deptry>=0.25.1",
    "types-requests>=2.31.0",
    "import-linter>=2.0",
    "pydeps>=3.0.0",
    "tach>=0.6.0",
    "vulture>=2.14",
    # "mcp-tools-py",  # TODO: uncomment once mcp-tools-py is published on PyPI
    # "mcp-coder",  # TODO: uncomment once mcp-coder is published on PyPI
]
typecheck = ["mypy>=1.13.0", "types-requests>=2.31.0", "pytest>=8.3.5", "pytest-asyncio>=0.25.3"]

# Tools for single CI jobs, not published as extras. Unpinned by design.
[dependency-groups]
coverage = ["coverage", "diff-cover"]
publish = ["build"]

[project.scripts]
mcp-workspace = "mcp_workspace.main:main"

[project.urls]
"Homepage" = "https://github.com/MarcusJellinghaus/mcp-workspace"
"Bug Tracker" = "https://github.com/MarcusJellinghaus/mcp-workspace/issues"
"Documentation" = "https://github.com/MarcusJellinghaus/mcp-workspace#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
tag_regex = '^(?P<version>\d+\.\d+\.\d+)$'
# Version is automatically determined from git tags
# Tag format: 0.1.0 -> version 0.1.0
# Between releases: 0.1.0.devN+gHASH (includes commit count and hash)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = ["--strict-markers", "--tb=short", "-n", "auto", "-p", "no:tach"]
markers = [
    "git_integration: File system git operations (repos, commits)",
    "github_integration: GitHub API access (requires GITHUB_TOKEN)",
    "performance: Timing-sensitive; skipped under xdist, run with -n 0 -m performance",
]

[tool.mcp-tools-py]
# Formatter for run_format_code and mcp-coder workflows: ruff (import sorting + ruff format)
formatter = "ruff"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]

[tool.ruff.lint]
# Rule selection — see the per-group comments below
# preview needed for DOC rules (pydoclint)
preview = true
explicit-preview-rules = true   # preview rules fire only when selected by exact code
select = [
    "D",
    "ANN",
    # DOC rules are preview-only; with explicit-preview-rules they must be
    # listed by exact code — a bare "DOC" prefix silently enforces nothing.
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    "SIM",
    # SIM905 is preview-only; see explicit-preview-rules note above.
    "SIM905",
    "E",
    "F",
    "C4", "B",
    "S",
    # PLW1510 only: the PL prefix would re-enable pylint's disabled R category (PLR09xx).
    "PLW1510",
    # PLE2502 bidirectional-unicode: covers bandit B613 (trojansource), which has no S port.
    "PLE2502",
    "UP",
    "I",
]
ignore = [
    "D107",  # missing docstring in __init__ method (redundant with class docstring)
    "ANN401",  # Any is correct at library/CLI boundaries; mypy strict covers the rest
    "E501",  # line length is owned by the formatter (ruff format); not re-checked here
]

[tool.ruff.lint.per-file-ignores]
# tests: assert is the pytest idiom (S101); S105/S106/S108 fire on fake
# credentials and "/tmp/..." literals used as test data, never opened.
# S603: tests start sys.executable with a fixed argv. Scoped here and to tools/
# on purpose: mcp_coder's global S603 ignore is not copied, src stays checked.
"tests/**/*.py" = ["D", "DOC", "SIM117", "S101", "S105", "S106", "S108", "S603"]
# DOC502: these modules document exceptions propagated from OS/git/GitHub
# calls or delegated utils (PermissionError, GitCommandError, ValueError,
# ...) — useful docs, keep them.
"src/mcp_workspace/file_tools/file_operations.py" = ["DOC502"]
"src/mcp_workspace/git_operations/read_operations.py" = ["DOC502"]
"src/mcp_workspace/server_reference_tools.py" = ["DOC502"]
"src/mcp_workspace/main.py" = ["DOC502"]
"src/mcp_workspace/workflows/task_tracker.py" = ["DOC502"]
# tools/: low-priority helper scripts that may move to an MCP server or be deleted;
# Returns sections are not required there. S603: the argv is built in the script.
"tools/**" = ["DOC201", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Dependency-declaration hygiene. Run as `deptry src`.
# src only: running it over tests/ yields DEP004 noise and no signal.
[tool.deptry]
known_first_party = ["mcp_workspace"]
# Extras holding dev-only packages: deptry exempts them from DEP002 and reports
# DEP004 if src/ imports them. Keep in sync with [project.optional-dependencies]:
# a renamed or removed extra only produces a deptry warning, not a failure.
optional_dependencies_dev_groups = ["dev", "typecheck"]

[tool.mcp-coder.install-from-github]
# Installed WITH deps (picks up external deps like jedi)
packages = [
    "mcp-coder-utils @ git+https://github.com/MarcusJellinghaus/mcp-coder-utils.git",
    "mcp-tools-py @ git+https://github.com/MarcusJellinghaus/mcp-tools-py.git",
]
# Installed WITHOUT deps (depends on all siblings — avoid downgrading)
packages-no-deps = [
    "mcp-coder @ git+https://github.com/MarcusJellinghaus/mcp_coder.git",
]

[tool.pylint.messages_control]
disable = [
    "C",       # conventions — not enabled in this project
    "R",       # refactor suggestions — not enabled in this project
    "W1203",   # logging-fstring-interpolation — project uses f-strings for readability
    "W0621",   # redefined-outer-name — standard pytest fixture pattern
    "W0511",   # fixme/TODO — informational only, not a quality gate
    "W0212",   # protected-access — legitimate in tests and controlled src usage
    "W0613",   # unused-argument — pytest fixtures injected by name
    "W0611",   # unused-import — owned by ruff F401 (pylint flags the X-as-X re-export convention)
    "W0404",   # reimported — reimports across test functions
    "W0718",   # broad-exception-caught — intentional catch-all in CLI/workflow error handling
    "W0706",   # try-except-raise — explicit re-raise for clarity in error chains
    "W4903",   # deprecated-argument — tracked for future cleanup
]
enable = ["R0401"]  # cyclic-import detection, off by default as it is in the refactor category

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Disable unreachable warnings for test files due to mypy false positives with assertions
# Disable union-attr for test files where mocked attributes are intentionally set
disable_error_code = ["unreachable", "union-attr"]
ignore_missing_imports = true
